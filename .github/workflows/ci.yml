name: Pipvane v3 CI/CD Quality & Latency Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'sprint-*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # STAGE 1: Code Quality, Linting & Formatting Gate
  # ============================================================================
  lint:
    name: Lint & Static Analysis (Flake8 & ESLint)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Python Linters & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8 Python Linting
        run: |
          python -m flake8 engine --max-line-length=120 --extend-ignore=E203,W503,E501,F401,E402,W291,W293,W391,E306,E261,F541,F841,E301

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run ESLint on Frontend TypeScript
        working-directory: ./frontend
        run: |
          npm run lint

  # ============================================================================
  # STAGE 2: Pytest Engine & Struct Alignment Tests
  # ============================================================================
  unit-tests:
    name: Pytest Engine & Struct Alignment Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pytest & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Engine & Chaos Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest qa/tests qa/chaos -v --durations=10 --tb=short --junitxml=pytest-results.xml

      - name: Print & Summarize Failed Tests
        if: always()
        run: |
          python qa/report_pytest_failures.py pytest-results.xml
        shell: cmd

      - name: Upload Pytest Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 14

  # ============================================================================
  # STAGE 3: Parser CI Gate (Mandatory >= 98% Golden Set Accuracy & Regression)
  # ============================================================================
  parser-gate:
    name: Parser CI Gate (1,500 Golden Set >= 98% & Regression Gate)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute 1,500-Signal Golden Set Parser Quality & Regression Gate
        env:
          PYTHONPATH: .
        run: |
          python qa/test_golden_parser.py --dataset qa/golden_set_1500.json --baseline qa/baseline_accuracy.json --threshold 0.98 --max-regression 0.005

      - name: Upload Parser Gate Evaluation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-parser-results
          path: qa/golden_parser_results.json
          retention-days: 14

  # ============================================================================
  # STAGE 4: Jest TypeScript Protocol Tests
  # ============================================================================
  jest-tests:
    name: Jest TypeScript Protocol Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install QA NPM Dependencies
        working-directory: ./qa
        run: |
          npm install

      - name: Execute Jest Unit Tests
        working-directory: ./qa
        run: |
          npx jest --config jest.config.js --passWithNoTests

  # ============================================================================
  # STAGE 5: Playwright UI Headless Verification
  # ============================================================================
  playwright-ui:
    name: Playwright UI E2E Automated Verification
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies & Build Static UI
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Install QA & Playwright Dependencies
        working-directory: ./qa
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright Headless Tests
        working-directory: ./qa
        run: |
          npx playwright test --project=chromium

      - name: Upload Playwright Test Report Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa/playwright-report/
          retention-days: 14

  # ============================================================================
  # STAGE 6: VR-3.1 High-Resolution IPC Latency Benchmark Gate
  # ============================================================================
  latency-benchmark:
    name: Sub-5ms IPC Latency Benchmark Gate (VR-3.1)
    runs-on: windows-latest
    needs: [unit-tests, parser-gate]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute High-Resolution IPC Benchmark Harness
        env:
          PYTHONPATH: .
        run: |
          python qa/benchmark/latency_benchmark.py

      - name: Upload Latency Benchmark Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-benchmark-results
          path: qa/benchmark/latency_benchmark_results.json
          retention-days: 14
