[pytest]
minversion = 7.0
testpaths =
    tests
    tests/unit
    tests/integration
    tests/parser_gate
    chaos
python_files = test_*.py *_test.py
python_classes = Test* *Suite
python_functions = test_*
addopts = -ra -q --strict-markers -v
markers =
    unit: Fast running unit tests for local engine logic
    integration: Integration tests between engine and mock terminals
    parser_gate: Golden set parser accuracy gate tests (>= 98% pass requirement)
    latency: Sub-5ms IPC benchmark and latency verification tests (VR-3.1)
    failover: Active-passive failover and anti-split-brain simulation tests (FR-7.4 & 7.5)
    chaos: Chaos engineering and network partition tests
    security: Security audit, DPAPI extraction resistance, and offline chronology tests (Sprint 8)
    asyncio: Asynchronous coroutine tests
pythonpath = . .. ../engine
